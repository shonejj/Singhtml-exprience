<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="description" content="THE LAST FREQUENCY — an atmospheric 2.5D/3D pixel-art science-fiction adventure on the silent planet Vesper-9.">
<title>The Last Frequency</title>
<style>
:root{
  --ink:#07080c; --panel:rgba(10,12,18,.88); --panel2:rgba(18,22,32,.92); --line:#2b3446; --line2:#46526b;
  --text:#d8dde8; --mute:#8b94a8; --amber:#ffb547; --amber2:#ffd590; --cyan:#6ff3ff; --red:#ff5a5a; --green:#8dff9a;
  --ui:1; --subsize:18px; --font: "Lucida Console","Courier New",ui-monospace,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
}
body.hc{ --panel:#000; --panel2:#000; --line:#fff; --line2:#fff; --text:#fff; --mute:#e8e8e8; --amber:#ffe100; --cyan:#00ffff; }
body.cb{ --red:#ff9a00; --green:#3fa9ff; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
.layer{position:absolute;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;display:none;pointer-events:auto;align-items:center;justify-content:center;
  padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal))}
.screen.on{display:flex;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.reduced .screen.on{animation:none}
.panel{background:var(--panel);border:1px solid var(--line);box-shadow:0 0 0 1px #000,0 18px 60px rgba(0,0,0,.6);position:relative;
  max-width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;transform:scale(var(--ui));transform-origin:center}
.panel:before,.panel:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--amber);pointer-events:none}
.panel:before{left:-3px;top:-3px;border-right:0;border-bottom:0}.panel:after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.ph{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;letter-spacing:.18em;color:var(--amber);text-transform:uppercase}
.ph .sp{flex:1}.pb{padding:14px;overflow:auto;min-height:0}
.pf{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;justify-content:flex-end}
button,.btn{font-family:var(--font);font-size:14px;color:var(--text);background:var(--panel2);border:1px solid var(--line2);padding:9px 14px;
  letter-spacing:.08em;cursor:pointer;text-transform:uppercase;outline:none;touch-action:manipulation}
button:hover,button:focus-visible,button.sel{border-color:var(--amber);color:var(--amber2);background:#1c1a14}
button:disabled{opacity:.35;cursor:default}
button.prim{border-color:var(--amber);color:var(--amber)}
.menu{display:flex;flex-direction:column;gap:6px;min-width:260px}
.menu button{text-align:left;padding:10px 16px;position:relative}
.menu button.sel:before,.menu button:focus-visible:before{content:"▸";position:absolute;left:3px;color:var(--amber)}
.small{font-size:12px;color:var(--mute);letter-spacing:.04em}
h1,h2,h3{margin:0;font-weight:normal}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{padding:6px 10px;font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #1d2433;font-size:13px}
.row label{flex:1;color:var(--mute)}.row .v{min-width:64px;text-align:right;color:var(--amber2)}
input[type=range]{width:180px;accent-color:var(--amber)}select{font-family:var(--font);background:#0e1119;color:var(--text);border:1px solid var(--line2);padding:5px}
input[type=checkbox]{accent-color:var(--amber);width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
/* Title */
#title{justify-content:flex-start;align-items:flex-end;background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,0) 60%)}
#title .logo{position:absolute;left:calc(5vw + var(--sal));top:calc(9vh + var(--sat));}
.logo .t1{font-size:clamp(28px,6vw,68px);letter-spacing:.32em;color:#f1e6cf;text-shadow:0 0 18px rgba(255,181,71,.45),2px 0 rgba(111,243,255,.35),-2px 0 rgba(255,90,90,.3);animation:sig 5s infinite steps(1)}
.logo .t2{font-size:clamp(11px,1.4vw,15px);letter-spacing:.6em;color:var(--amber);margin-top:6px}
@keyframes sig{0%,92%,100%{transform:none;opacity:1}93%{transform:translateX(3px) skewX(8deg);opacity:.75}95%{transform:translateX(-2px);opacity:.9}}
.reduced .logo .t1{animation:none}
#title .menu{margin:0 0 6vh 5vw}
#title .saveinfo{position:absolute;right:calc(18px + var(--sar));bottom:calc(14px + var(--sab));text-align:right}
/* HUD */
#hud{font-size:13px;text-shadow:0 1px 0 #000,0 0 6px #000}
#hud .tl{position:absolute;left:calc(14px + var(--sal));top:calc(12px + var(--sat));display:flex;flex-direction:column;gap:5px}
.bar{width:180px;height:8px;background:rgba(0,0,0,.6);border:1px solid #39435a;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);transition:width .12s}
.bar.hp i{background:#e8edf5}.bar.hp.low i{background:var(--red)}.bar.heat i{background:var(--cyan)}.bar.heat.hot i{background:var(--red)}.bar.st i{background:#9fb7d9}
.bar.boss{width:min(520px,70vw);height:10px}.bar.boss i{background:linear-gradient(90deg,#ff7a5a,#ffb547)}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(30px + var(--sab));text-align:center;display:none}
#bossbar .n{letter-spacing:.3em;color:var(--amber2);margin-bottom:4px;font-size:12px}
#hud .tr{position:absolute;right:calc(14px + var(--sar));top:calc(12px + var(--sat));text-align:right;max-width:44vw}
#obj{color:var(--text);font-size:13px}#obj b{color:var(--amber);font-weight:normal;letter-spacing:.12em;display:block;font-size:11px}
#compass{position:absolute;left:50%;top:calc(10px + var(--sat));transform:translateX(-50%);width:min(420px,52vw);height:24px;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.25);
  mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
#compass span{position:absolute;top:2px;transform:translateX(-50%);font-size:11px;color:#cfd6e4;white-space:nowrap}
#compass span.m{color:var(--amber)}#compass span.s{color:var(--cyan)}#compass span.e{color:var(--red)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);padding:6px 12px;background:rgba(0,0,0,.65);border:1px solid var(--line2);display:none;white-space:nowrap}
#prompt kbd,.kbd{display:inline-block;min-width:22px;padding:1px 6px;margin-right:8px;border:1px solid var(--amber);color:var(--amber);text-align:center;font-family:var(--font)}
#weap{position:absolute;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));text-align:right}
#weap .w{font-size:14px;letter-spacing:.14em;color:var(--amber2)}
#scanhud{position:absolute;left:50%;bottom:calc(16% + var(--sab));transform:translateX(-50%);display:none;text-align:center;color:var(--cyan)}
#scanhud canvas{width:260px;height:48px;image-rendering:pixelated;border:1px solid rgba(111,243,255,.4);background:rgba(0,20,30,.45)}
#reticle{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:1px solid rgba(255,255,255,.7);display:none}
#reticle.lock{border-color:var(--red);transform:rotate(45deg)}
#markers{position:absolute;inset:0}#markers div{position:absolute;transform:translate(-50%,-100%);font-size:11px;color:var(--cyan);white-space:nowrap}
#markers div.e{color:var(--red)}#markers div.q{color:var(--amber)}
#toast{position:absolute;left:50%;top:calc(18% + var(--sat));transform:translateX(-50%);text-align:center;pointer-events:none}
#toast div{background:rgba(0,0,0,.72);border:1px solid var(--line2);padding:7px 14px;margin:4px;animation:toast 3.4s forwards;letter-spacing:.1em}
#toast div.cp{border-color:var(--amber);color:var(--amber)}
@keyframes toast{0%{opacity:0;transform:translateY(-6px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}
#subs{position:absolute;left:50%;bottom:calc(12% + var(--sab));transform:translateX(-50%);width:min(860px,90vw);text-align:center;font-size:var(--subsize);line-height:1.35}
#subs div{display:inline-block;padding:4px 10px;margin:2px}
#subs.bg div{background:rgba(0,0,0,.72)}
#subs b{color:var(--amber);font-weight:normal}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#fade.on{opacity:1}
#chap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;pointer-events:none}
#chap .a{letter-spacing:.6em;color:var(--amber);font-size:13px}#chap .b{font-size:clamp(22px,4vw,44px);letter-spacing:.2em;margin-top:10px}#chap .c{color:var(--mute);margin-top:10px;letter-spacing:.3em;font-size:12px}
#cine{position:absolute;inset:0;pointer-events:none;display:none}
#cine:before,#cine:after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000}#cine:before{top:0}#cine:after{bottom:0}
#cinetext{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:clamp(16px,2.4vw,26px);letter-spacing:.12em;color:#efe6d2;text-shadow:0 0 12px #000;padding:0 6vw}
#skip{position:absolute;right:calc(16px + var(--sar));bottom:calc(10vh + 10px + var(--sab));pointer-events:auto;display:none;font-size:12px}
/* Dialogue */
#dlg{position:absolute;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);width:min(900px,96vw);display:none;pointer-events:auto}
#dlg .panel{max-width:none}
#dlg .who{color:var(--amber);letter-spacing:.2em;font-size:12px;display:flex;gap:10px;align-items:center}
#dlg .who canvas{width:48px;height:48px;image-rendering:pixelated;border:1px solid var(--line2);background:#0a0c12}
#dlg .txt{font-size:calc(var(--subsize) - 1px);line-height:1.45;min-height:3em;margin-top:8px}
#dlg .ch{display:flex;flex-direction:column;gap:5px;margin-top:10px}
#dlg .ch button{text-align:left;text-transform:none;letter-spacing:.02em}
#dlg .tag{color:var(--cyan);font-size:11px;margin-left:6px}
/* Kit (pause) */
#kit .panel{width:min(1100px,100%);height:min(720px,100%)}
#kit .pb{flex:1}
.list{display:flex;flex-direction:column;gap:4px}
.list .it{padding:8px 10px;border:1px solid #1f2738;cursor:pointer;font-size:13px}
.list .it.sel,.list .it:hover{border-color:var(--amber)}
.list .it .small{display:block}
.two{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:14px;height:100%}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.detail{border:1px solid #1f2738;padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow:auto}
.detail h3{color:var(--amber);margin-bottom:8px;font-size:15px;letter-spacing:.1em}
.stat{display:flex;justify-content:space-between;border-bottom:1px dashed #222b3c;padding:3px 0;font-size:13px}
.stat b{font-weight:normal;color:var(--amber2)}
#mapc{width:100%;height:100%;min-height:300px;image-rendering:pixelated;background:#0b0d10;border:1px solid #1f2738;cursor:crosshair}
/* creator */
#creator .panel{width:min(1100px,100%);height:min(760px,100%);background:linear-gradient(90deg,var(--panel) 0,var(--panel) 46%,rgba(10,12,18,.15) 60%);}
#creator .pb{flex:1;display:grid;grid-template-columns:minmax(260px,440px) 1fr;gap:10px}
#creator .opts{overflow:auto;padding-right:6px}
#creator .pv{position:relative}
#creator .pv .anims{position:absolute;bottom:4px;left:0;right:0;display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
#creator .pv .anims button{font-size:11px;padding:5px 8px}
.opt{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #1d2433;font-size:13px}
.opt label{flex:0 0 120px;color:var(--mute)}.opt .ctl{flex:1;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.opt .ctl button{padding:4px 9px;font-size:12px}.opt .ctl .val{flex:1;text-align:center;color:var(--amber2);font-size:12px}
.sw{width:22px;height:22px;border:1px solid #000;cursor:pointer;outline:1px solid #333}.sw.sel{outline:2px solid var(--amber)}
@media (max-width:760px){#creator .pb{grid-template-columns:1fr;grid-template-rows:1fr 34vh}#creator .pv{order:-1}}
/* puzzle */
#puz .panel{width:min(760px,100%)}
#puzc{width:100%;max-width:700px;aspect-ratio:7/4;image-rendering:pixelated;background:#050a0e;border:1px solid #1f3a44;touch-action:none;display:block;margin:0 auto}
#puz .ctr{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#puz .ctr .row{border:0;min-width:240px}
#puz .ctr .dial{gap:6px}#puz .ctr .dial input{width:150px;touch-action:pan-x}#puz button.st{width:44px;height:44px;padding:0;font-size:16px;touch-action:manipulation;flex:none}
@media (max-height:560px){#puz .panel{width:min(940px,100%)!important;max-height:100%}#puz .pb{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px}#puz #puzc{max-height:calc(100vh - 120px);width:100%}#puz .ctr{flex-direction:column;flex-wrap:nowrap;margin:0;gap:4px}#puz .ctr .row{min-width:0}#puz .ctr .dial input{width:100%;flex:1;min-width:60px}#puz #puzhint{grid-column:1/3;margin-top:0;font-size:11px}#puz .ph{padding:6px 10px}#puz .pf{padding:6px 10px}}
#puz,#puz *{touch-action:manipulation}#puz input[type=range]{touch-action:pan-x}
/* touch */
#touch{display:none}
#touch.on{display:block}
#touch .stick{position:absolute;left:calc(var(--tpad,3vw) + var(--sal));bottom:calc(16px + var(--sab));width:calc(150px*var(--ts));height:calc(150px*var(--ts));border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.18);pointer-events:auto;opacity:var(--to)}
#touch .stick i{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:rgba(255,181,71,.55)}
#touch .tb{position:absolute;width:calc(58px*var(--ts));height:calc(58px*var(--ts));border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;
  font-size:calc(11px*var(--ts));display:flex;align-items:center;justify-content:center;pointer-events:auto;opacity:var(--to);letter-spacing:.05em;text-align:center;line-height:1}
#touch .tb.act{background:rgba(255,181,71,.55);border-color:var(--amber)}
#touch .tb.sm{width:calc(44px*var(--ts));height:calc(44px*var(--ts));font-size:calc(10px*var(--ts))}
#touch .cam{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto}
body.lefty #touch .stick{left:auto;right:calc(var(--tpad,3vw) + var(--sar))}
body.touchui #weap{bottom:auto;top:calc(56px + var(--sat))}body.touchui #weap .bar{display:none}
#rot{position:absolute;inset:0;background:#000;color:var(--amber);display:none;align-items:center;justify-content:center;text-align:center;z-index:50;padding:20px;pointer-events:auto}
#loading .bar{width:min(420px,70vw);height:6px}
#loading .tip{margin-top:14px;color:var(--mute);font-size:13px;max-width:560px;text-align:center}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:99;padding:20px;text-align:center;line-height:1.6}
#credits .roll{white-space:pre-wrap;text-align:center;line-height:1.7;font-size:14px}
.slot{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid #1f2738;margin-bottom:6px;cursor:pointer}
.slot.sel,.slot:hover{border-color:var(--amber)}.slot .n{color:var(--amber);min-width:70px}
.slot .d{flex:1;font-size:12px;color:var(--mute)}
.confirm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:auto;z-index:40}
#perf{position:absolute;left:4px;bottom:4px;font-size:11px;color:#9f9;display:none;pointer-events:none;text-shadow:0 1px #000}
.hint{color:var(--cyan)}
</style>
</head>
<body>
<div id="app">
<canvas id="gl"></canvas>
<div class="layer" id="hud" style="display:none">
  <div class="tl">
    <div class="bar hp" id="hpbar"><i></i></div>
    <div class="bar st" id="stbar" style="width:120px;height:5px"><i></i></div>
    <div class="small" id="salv"></div>
  </div>
  <div id="compass"></div>
  <div class="tr"><div id="obj"></div><div class="small" id="sig" style="margin-top:6px"></div></div>
  <div id="markers"></div>
  <div id="reticle"></div>
  <div id="prompt"></div>
  <div id="scanhud"><canvas id="scanc" width="130" height="24"></canvas><div class="small" id="scantxt" style="color:var(--cyan)"></div></div>
  <div id="weap"><div class="w" id="wname"></div><div class="bar heat" id="heatbar" style="width:140px;margin-left:auto;margin-top:4px"><i></i></div><div class="small" id="wsub"></div></div>
  <div id="bossbar"><div class="n" id="bossname"></div><div class="bar boss"><i id="bosshp"></i></div></div>
</div>
<div class="layer" id="touch">
  <div class="cam" id="tcam"></div>
  <div class="stick" id="tstick"><i></i></div>
  <div class="tb" data-a="fire" style="right:calc(20px + var(--sar));bottom:calc(84px*var(--ts) + 16px + var(--sab))">FIRE</div>
  <div class="tb" data-a="jump" style="right:calc(70px*var(--ts) + 20px + var(--sar));bottom:calc(16px + var(--sab))">JUMP</div>
  <div class="tb" data-a="dodge" style="right:calc(20px + var(--sar));bottom:calc(16px + var(--sab))">ROLL</div>
  <div class="tb" data-a="interact" style="right:calc(140px*var(--ts) + 20px + var(--sar));bottom:calc(40px*var(--ts) + 16px + var(--sab))">USE</div>
  <div class="tb" data-a="scan" style="right:calc(70px*var(--ts) + 20px + var(--sar));bottom:calc(84px*var(--ts) + 16px + var(--sab))">SCAN</div>
  <div class="tb sm" data-a="burst" style="right:calc(24px + var(--sar));bottom:calc(158px*var(--ts) + 16px + var(--sab))">BURST</div>
  <div class="tb sm" data-a="melee" style="right:calc(76px*var(--ts) + 24px + var(--sar));bottom:calc(158px*var(--ts) + 16px + var(--sab))">MELEE</div>
  <div class="tb sm" data-a="sprint" data-toggle="1" style="left:calc(170px*var(--ts) + 3vw + var(--sal));bottom:calc(16px + var(--sab))">SPRINT</div>
  <div class="tb sm" data-a="crouch" data-toggle="1" style="left:calc(170px*var(--ts) + 3vw + var(--sal));bottom:calc(56px*var(--ts) + 22px + var(--sab))">CROUCH</div>
  <div class="tb sm" data-a="pause" style="left:calc(14px + var(--sal));top:calc(64px + var(--sat))">❚❚</div>
  <div class="tb sm" data-a="camera" style="left:calc(64px*var(--ts) + 14px + var(--sal));top:calc(64px + var(--sat))">CAM</div>
  <div class="tb sm" data-a="weapon" style="right:calc(24px + var(--sar));top:calc(96px + var(--sat))">WPN</div>
  <div class="tb sm" data-a="lamp" style="right:calc(54px*var(--ts) + 24px + var(--sar));top:calc(96px + var(--sat))">LAMP</div>
  <div class="tb sm" data-a="lock" style="right:calc(108px*var(--ts) + 24px + var(--sar));top:calc(96px + var(--sat))">LOCK</div>
</div>
<div class="layer" id="toast"></div>
<div class="layer" id="cine"><div id="cinetext"></div></div>
<div class="layer" id="subs" class="bg"></div>
<div class="layer" id="chap"><div class="a" id="chapa"></div><div class="b" id="chapb"></div><div class="c" id="chapc"></div></div>
<div id="dlg"><div class="panel"><div class="pb"><div class="who"><canvas id="dlgface" width="16" height="16"></canvas><span id="dlgwho"></span></div><div class="txt" id="dlgtxt"></div><div class="ch" id="dlgch"></div></div></div></div>
<button id="skip">Skip ▸▸</button>

<div class="screen" id="title">
  <div class="logo"><div class="t1">THE LAST<br>FREQUENCY</div><div class="t2">VESPER-9 · AFTER THE QUIET</div></div>
  <div class="menu" id="titlemenu"></div>
